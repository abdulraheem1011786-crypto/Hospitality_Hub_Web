<!DOCTYPE html>
<html>
<head>
    <title>Image Upload Test</title>
</head>
<body>
<h1>Image Upload API Test</h1>
<pre id="result"></pre>

<script>
async function testImageUpload() {
    // Create a simple 1x1 pixel PNG
    const pngData = new Uint8Array([
        0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A, 0x0A, 0x00, 0x00, 0x00, 0x0D, 0x49, 0x48, 0x44, 0x52,
        0x00, 0x00, 0x00, 0x01, 0x00, 0x00, 0x00, 0x01, 0x08, 0x02, 0x00, 0x00, 0x00, 0x90, 0x77, 0x53,
        0xDE, 0x00, 0x00, 0x00, 0x0C, 0x49, 0x44, 0x41, 0x54, 0x08, 0x99, 0x63, 0xF8, 0xFF, 0xFF, 0xFF,
        0x7F, 0x00, 0x09, 0xFB, 0x03, 0xFD, 0x05, 0x39, 0xF6, 0xEE, 0x00, 0x00, 0x00, 0x00, 0x49, 0x45,
        0x4E, 0x44, 0xAE, 0x42, 0x60, 0x82
    ]);
    
    const blob = new Blob([pngData], { type: 'image/png' });
    const file = new File([blob], 'test-image.png', { type: 'image/png' });
    
    const formData = new FormData();
    formData.append('venue_type', 'hotel');
    formData.append('venue_id', '1');
    formData.append('images[]', file);
    formData.append('alt_text[0]', 'Test Hotel Image');
    
    const token = '1|G8Gk25ap0XaBV86Ulm0vXdXLqZ0FUUjhrgOMKl6g3abd043d';
    
    try {
        const response = await fetch('/api/admin/images/upload', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`
            },
            body: formData
        });
        
        const text = await response.text();
        document.getElementById('result').textContent = `Status: ${response.status}\nResponse:\n${text}`;
    } catch (error) {
        document.getElementById('result').textContent = `Error: ${error.message}`;
    }
}

testImageUpload();
</script>
</body>
</html>
